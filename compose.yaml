# Start:  docker compose up -d --build   →   http://localhost:8080
# Tests:  docker compose run --rm test
services:
  app:
    build: .
    image: unkenntlich:0.2.0
    ports:
      - "127.0.0.1:${UK_PORT:-8080}:8080"
    volumes:
      - daten:/daten
    restart: unless-stopped

  test:
    image: unkenntlich:0.2.0
    profiles: ["test"]
    network_mode: none
    volumes:
      - .:/app:ro
      - /tmp
    environment:
      PYTHONPYCACHEPREFIX: /tmp/pyc
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests"]

volumes:
  daten:
